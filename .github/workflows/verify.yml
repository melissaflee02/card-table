# Runs the build and the full test suite on branches and pull requests.
#
# deploy.yml already runs `npm test` before publishing, so main is protected.
# This exists so the answer arrives *before* you merge rather than after: push
# a branch, see it go green, then merge knowing the deploy will succeed.
#
# Deliberately has no `pages: write` permission and produces no artifact — it
# can only report, never publish.
name: Verify

on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      # Builds, then asserts on the generated site: link and anchor integrity,
      # unique titles and descriptions, sitemap coverage, share cards, script
      # syntax, and the accessibility invariants.
      - name: Build and verify
        run: npm test

      # The published site must be reproducible from source alone. If a build
      # leaves the working tree dirty, something generated is being committed
      # by hand and will drift.
      - name: Check the build is reproducible
        run: |
          git diff --exit-code -- . ':(exclude)dist' \
            || { echo "::error::Building modified tracked files — commit the result or stop generating it"; exit 1; }
