# Builds the site and publishes dist/ to GitHub Pages on every push to main.
# The project has no dependencies, so there is no install step.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      # `npm test` builds first, then asserts on the generated site: link
      # integrity, unique titles and descriptions, sitemap coverage, valid
      # markup, and the accessibility invariants. A failure here stops the
      # deploy, so a broken page never reaches production.
      - name: Build and verify
        run: npm test

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
